<title>曙光劍姬 Aurora Blade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Noto+Sans+TC:wght@500;700&family=Noto+Serif+TC:wght@900&display=swap">
<style>
/* 單一深色世界：全螢幕畫布＋觸控按鍵浮層。遊戲本身固定深色，不跟隨主題切換 */
:root {
  --void: #05040f;
  --ink: #e9e6ff;
  --dim: #8f88c7;
  --dawn: #ffc76a;
  --blade: #9fe8ff;
  --pad: rgba(30, 24, 70, 0.55);
  --pad-edge: rgba(159, 232, 255, 0.35);
  --f-ui: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--void); color: var(--ink); }
body { font-family: var(--f-ui); -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
#cv { position: fixed; inset: 0; display: block; touch-action: none; outline: none; }
#touch { position: fixed; inset: 0; pointer-events: none; }
#touch .grp { position: absolute; display: grid; gap: 8px; pointer-events: auto; }
#touch .left { left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); grid-template-columns: repeat(3, 54px); grid-template-areas: ". u ." "l d r"; }
#touch .right { right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); grid-template-columns: repeat(4, 54px); }
#touch .top { right: max(16px, env(safe-area-inset-right, 0px)); top: calc(12px + env(safe-area-inset-top, 0px)); grid-auto-flow: column; }
#touch button {
  width: 54px; height: 54px; border-radius: 50%;
  border: 1.5px solid var(--pad-edge); background: var(--pad); color: var(--ink);
  font: 700 17px var(--f-ui); touch-action: none; -webkit-tap-highlight-color: transparent;
}
#touch button.big { font-size: 19px; }
#touch .top button { width: 44px; height: 44px; font-size: 13px; border-radius: 10px; }
#touch button.on { background: rgba(159, 232, 255, 0.35); border-color: var(--blade); }
#touch button:focus-visible { outline: 2px solid var(--dawn); outline-offset: 2px; }
@media (max-height: 420px) {
  #touch .left { grid-template-columns: repeat(3, 46px); }
  #touch .right { grid-template-columns: repeat(4, 46px); }
  #touch button { width: 46px; height: 46px; font-size: 15px; }
}
</style>

<canvas id="cv" tabindex="0" aria-label="曙光劍姬 遊戲畫面"></canvas>
<div id="touch" hidden>
  <div class="grp left">
    <button data-act="up" style="grid-area:u" aria-label="往上看">▲</button>
    <button data-act="left" style="grid-area:l" aria-label="向左">◀</button>
    <button data-act="down" style="grid-area:d" aria-label="蹲下">▼</button>
    <button data-act="right" style="grid-area:r" aria-label="向右">▶</button>
  </div>
  <div class="grp right">
    <button data-act="dodgeL" aria-label="往左閃避">◀閃</button>
    <button data-act="dodgeR" aria-label="往右閃避">閃▶</button>
    <button data-act="item" aria-label="使用藥水">藥</button>
    <button data-act="magic" aria-label="魔法">魔</button>
    <button data-act="light" class="big" aria-label="輕拳">輕</button>
    <button data-act="heavy" class="big" aria-label="重拳">重</button>
    <button data-act="slide" class="big" aria-label="滑行">滑</button>
    <button data-act="jump" class="big" aria-label="跳躍">跳</button>
  </div>
  <div class="grp top">
    <button data-act="retro" aria-label="切換像素模式">像素</button>
    <button data-act="mute" aria-label="靜音">音</button>
    <button data-act="pause" aria-label="暫停">❚❚</button>
  </div>
</div>

<script>
'use strict';
// ───────── 基本設定 ─────────
const VW = 960, VH = 540, G = 2200, LEVEL_W = 7560, ARENA_X = 6600;
const FS = "'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif";
const FT = "'Noto Serif TC','PMingLiU','Songti TC',serif";
const FL = "'Cinzel','Times New Roman',serif";
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hex(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function mix(a, b, t) { const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], t))).join(',')})`; }
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } }
};

// ───────── 畫布與解析度 ─────────
const cvs = document.getElementById('cv'), ctx = cvs.getContext('2d');
const low = document.createElement('canvas'); low.width = 320; low.height = 180;
const lctx = low.getContext('2d');
let dpr = 1, scale = 1, offX = 0, offY = 0, retro = store.get('ab.retro', false);
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  const w = innerWidth, h = innerHeight;
  cvs.width = Math.round(w * dpr); cvs.height = Math.round(h * dpr);
  cvs.style.width = w + 'px'; cvs.style.height = h + 'px';
  scale = Math.min(cvs.width / VW, cvs.height / VH);
  offX = (cvs.width - VW * scale) / 2; offY = (cvs.height - VH * scale) / 2;
}
addEventListener('resize', resize); resize();

// ───────── 輸入：鍵盤、手把、觸控 ─────────
// 鍵盤的 J I K L 對應手把的 X Y A B（同樣是左、上、下、右的菱形排列）
const keys = {}, pad = {}, touch = {}, pressed = {};
const KEYMAP = {
  ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowDown: 'down', KeyS: 'down', ArrowUp: 'up', KeyW: 'up',
  KeyK: 'jump', Space: 'jump', KeyJ: 'light', KeyI: 'heavy', KeyL: 'slide',
  KeyQ: 'dodgeL', KeyE: 'dodgeR', KeyU: 'item', KeyO: 'magic',
  Enter: 'start', KeyP: 'pause', Escape: 'pause', KeyM: 'mute', KeyH: 'retro'
};
addEventListener('keydown', e => {
  const a = KEYMAP[e.code]; if (!a) return;
  e.preventDefault(); if (!keys[a]) pressed[a] = true; keys[a] = true; audio.unlock();
});
addEventListener('keyup', e => { const a = KEYMAP[e.code]; if (a) keys[a] = false; });
const isDown = a => !!(keys[a] || pad[a] || touch[a]);
const hit = a => !!pressed[a];
const anyStart = () => hit('start') || hit('light') || hit('jump');

// Xbox 手把（瀏覽器的 standard 配置）：X 輕拳、Y 重拳、A 跳、B 滑行、LB 往左閃避、RB 往右閃避
// （往面向的方向是前衝刺，往背後是後空翻）、LT 藥水、RT 魔法、左類比或十字鍵移動／往上看／蹲下、
// Menu 開始／暫停、View 切換像素模式、按下左類比 靜音
const PAD_ACTS = ['left', 'right', 'up', 'down', 'jump', 'light', 'heavy', 'slide', 'dodgeL', 'dodgeR', 'item', 'magic', 'start', 'retro', 'mute'];
const MENU_IGNORE = ['heavy', 'slide', 'dodgeL', 'dodgeR', 'item', 'magic'];
const padPrev = {};
let padName = '', padToast = 0;
function pads() {
  try { return navigator.getGamepads ? [...navigator.getGamepads()].filter(g => g && g.connected) : []; } catch (e) { return []; }
}
function pollPad() {
  const now = {}, list = pads();
  for (const gp of list) {
    const b = i => !!(gp.buttons[i] && (gp.buttons[i].pressed || gp.buttons[i].value > 0.5));
    const ax = gp.axes[0] || 0, ay = gp.axes[1] || 0;
    now.left ||= ax < -0.4 || b(14); now.right ||= ax > 0.4 || b(15);
    now.up ||= ay < -0.55 || b(12); now.down ||= ay > 0.55 || b(13);
    now.jump ||= b(0); now.slide ||= b(1); now.light ||= b(2); now.heavy ||= b(3);
    now.dodgeL ||= b(4); now.dodgeR ||= b(5); now.item ||= b(6); now.magic ||= b(7);
    now.start ||= b(9); now.retro ||= b(8); now.mute ||= b(10);
  }
  for (const k of PAD_ACTS) {
    if (now[k] && !padPrev[k]) { pressed[k] = true; audio.unlock(); }
    pad[k] = padPrev[k] = !!now[k];
  }
  // 選單裡只有 A、X、Menu 當確認，其他戰鬥鍵不做事
  if (state !== 'play') for (const k of MENU_IGNORE) pressed[k] = false;
}
function rumble(strong, weak, ms) {
  for (const gp of pads()) {
    const a = gp.vibrationActuator;
    if (a && a.playEffect) a.playEffect('dual-rumble', { startDelay: 0, duration: ms, strongMagnitude: strong, weakMagnitude: weak }).catch(() => { });
  }
}
addEventListener('gamepadconnected', e => {
  padName = /xbox|xinput|045e/i.test(e.gamepad.id) ? 'Xbox 手把' : '手把'; padToast = 3;
  rumble(0.3, 0.3, 120);
});
addEventListener('gamepaddisconnected', () => { if (!pads().length) { padName = ''; padToast = 2.5; if (state === 'play') setState('pause'); } });

const touchUI = document.getElementById('touch');
if ('ontouchstart' in window || navigator.maxTouchPoints > 0) touchUI.hidden = false;
touchUI.querySelectorAll('button').forEach(btn => {
  const act = btn.dataset.act;
  const on = e => { e.preventDefault(); audio.unlock(); if (!touch[act]) pressed[act] = true; touch[act] = true; btn.classList.add('on'); try { btn.setPointerCapture(e.pointerId); } catch (_) { } };
  const off = e => { e.preventDefault(); touch[act] = false; btn.classList.remove('on'); };
  btn.addEventListener('pointerdown', on);
  btn.addEventListener('pointerup', off); btn.addEventListener('pointercancel', off);
  btn.addEventListener('contextmenu', e => e.preventDefault());
});
cvs.addEventListener('pointerdown', () => { audio.unlock(); cvs.focus(); if (state !== 'play') pressed.start = true; });

// ───────── 音樂與音效（WebAudio 即時合成） ─────────
const TRACKS = {
  title: { bpm: 100, len: 32, drums: false, roots: [45, 41, 36, 43],
    lead: [64, 0, 0, 67, 69, 0, 0, 0, 72, 0, 71, 0, 69, 0, 67, 0, 65, 0, 0, 69, 72, 0, 0, 0, 71, 0, 67, 0, 64, 0, 0, 0], wave: 'triangle' },
  stage: { bpm: 150, len: 32, drums: true, roots: [45, 41, 43, 40],
    lead: [76, 0, 74, 76, 72, 0, 69, 0, 77, 0, 76, 74, 72, 0, 74, 0, 74, 0, 72, 74, 71, 0, 67, 0, 72, 71, 69, 71, 64, 0, 0, 0], wave: 'square' },
  boss: { bpm: 172, len: 32, drums: true, roots: [38, 38, 46, 45],
    lead: [74, 0, 77, 0, 81, 0, 80, 81, 77, 0, 74, 0, 73, 0, 74, 0, 70, 0, 74, 0, 77, 0, 76, 77, 76, 0, 73, 0, 69, 0, 0, 0], wave: 'sawtooth' }
};
const audio = {
  ac: null, master: null, music: null, noise: null, muted: store.get('ab.muted', false), track: null, step: 0, next: 0,
  unlock() {
    if (this.ac) { if (this.ac.state === 'suspended') this.ac.resume(); return; }
    try {
      const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
      this.ac = new C();
      this.master = this.ac.createGain(); this.master.gain.value = this.muted ? 0 : 0.5; this.master.connect(this.ac.destination);
      this.music = this.ac.createGain(); this.music.gain.value = 0.32; this.music.connect(this.master);
      const len = this.ac.sampleRate, buf = this.ac.createBuffer(1, len, len), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.noise = buf; this.next = this.ac.currentTime + 0.05;
    } catch (e) { this.ac = null; }
  },
  toggleMute() { this.muted = !this.muted; store.set('ab.muted', this.muted); if (this.master) this.master.gain.value = this.muted ? 0 : 0.5; },
  play(name) { if (this.track === name) return; this.track = name; this.step = 0; if (this.ac) this.next = this.ac.currentTime + 0.06; },
  stop() { this.track = null; },
  tone(type, f0, f1, t, dur, vol, dest) {
    if (!this.ac) return;
    const o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest || this.master); o.start(t); o.stop(t + dur + 0.02);
  },
  burst(t, dur, vol, ftype, freq, dest) {
    if (!this.ac) return;
    const s = this.ac.createBufferSource(), f = this.ac.createBiquadFilter(), g = this.ac.createGain();
    s.buffer = this.noise; f.type = ftype; f.frequency.value = freq;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(dest || this.master); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
  },
  tick() {
    if (!this.ac || !this.track) return;
    const T = TRACKS[this.track], sd = 60 / T.bpm / 2, now = this.ac.currentTime;
    if (this.next < now - 0.3) this.next = now + 0.02;
    while (this.next < now + 0.12) {
      const s = this.step, t = this.next, m = f => 440 * Math.pow(2, (f - 69) / 12);
      const root = T.roots[Math.floor(s / 8) % T.roots.length];
      if (T.drums || s % 2 === 0) this.tone('triangle', m(root + (s % 2 ? 12 : 0)), 0, t, sd * 0.9, 0.5, this.music);
      const n = T.lead[s]; if (n) this.tone(T.wave, m(n), 0, t, sd * 1.7, T.wave === 'square' ? 0.16 : T.wave === 'sawtooth' ? 0.13 : 0.3, this.music);
      if (T.drums) {
        if (s % 4 === 0) this.tone('sine', 140, 40, t, 0.16, 0.7, this.music);
        if (s % 8 === 4) this.burst(t, 0.12, 0.35, 'bandpass', 1800, this.music);
        this.burst(t, 0.03, 0.12, 'highpass', 7000, this.music);
      }
      this.step = (s + 1) % T.len; this.next += sd;
    }
  },
  sfx(name) {
    if (!this.ac) return; const t = this.ac.currentTime;
    switch (name) {
      case 'jump': this.tone('square', 300, 640, t, 0.11, 0.12); break;
      case 'flip': this.tone('triangle', 500, 1300, t, 0.2, 0.2); this.burst(t, 0.2, 0.2, 'highpass', 2500); break;
      case 'slide': this.burst(t, 0.18, 0.3, 'lowpass', 900); break;
      case 'punch': this.burst(t, 0.07, 0.3, 'bandpass', 1400); break;
      case 'kick': this.burst(t, 0.14, 0.32, 'bandpass', 700); this.tone('sine', 300, 160, t, 0.1, 0.08); break;
      case 'charge': this.tone('sawtooth', 200, 900, t, 0.3, 0.1); this.burst(t, 0.3, 0.2, 'highpass', 3000); break;
      case 'hit': this.burst(t, 0.06, 0.5, 'lowpass', 1800); this.tone('square', 180, 70, t, 0.07, 0.16); break;
      case 'smash': this.burst(t, 0.5, 0.8, 'lowpass', 1200); this.tone('sine', 160, 35, t, 0.5, 0.6); [1047, 1568, 2093].forEach((f, i) => this.tone('triangle', f, 0, t + 0.04 + i * 0.05, 0.3, 0.15)); break;
      case 'kill': this.burst(t, 0.28, 0.4, 'lowpass', 2400); this.tone('sine', 700, 90, t, 0.25, 0.2); break;
      case 'hurt': this.tone('sawtooth', 420, 90, t, 0.32, 0.22); break;
      case 'pickup': [880, 1175, 1568].forEach((f, i) => this.tone('triangle', f, 0, t + i * 0.06, 0.12, 0.25)); break;
      case 'potion': [523, 659, 784, 1047].forEach((f, i) => this.tone('sine', f, 0, t + i * 0.07, 0.25, 0.25)); break;
      case 'magic': this.tone('sine', 660, 1760, t, 0.25, 0.22); this.tone('triangle', 1320, 2640, t + 0.05, 0.2, 0.1); break;
      case 'error': this.tone('square', 140, 120, t, 0.18, 0.12); break;
      case 'shoot': this.tone('sine', 520, 240, t, 0.16, 0.16); break;
      case 'boom': this.burst(t, 0.7, 0.7, 'lowpass', 500); this.tone('sine', 90, 30, t, 0.6, 0.5); break;
      case 'dash': this.burst(t, 0.3, 0.4, 'bandpass', 600); break;
      case 'check': [659, 784, 988, 1319].forEach((f, i) => this.tone('triangle', f, 0, t + i * 0.08, 0.2, 0.22)); break;
    }
  }
};

// ───────── 關卡 ─────────
const solids = [];
function S(x, y, w, h, kind) { const s = { x, y, w, h, kind, off: false }; solids.push(s); return s; }
S(-60, -400, 60, 1200, 'wall');
S(0, 460, 1400, 220, 'ground'); S(1520, 460, 1080, 220, 'ground'); S(2760, 460, 740, 220, 'ground');
S(3500, 400, 700, 280, 'ground'); S(4340, 460, 860, 220, 'ground'); S(5200, 420, 700, 260, 'ground');
S(6040, 460, 1520, 220, 'ground'); S(LEVEL_W, -400, 80, 1200, 'wall');
[[600, 340, 160], [1000, 280, 140], [1410, 370, 100], [2620, 360, 120], [3000, 300, 160], [3300, 220, 140],
 [4215, 330, 110], [4600, 320, 160], [4900, 240, 140], [5915, 350, 110], [6200, 330, 140]].forEach(([x, y, w]) => S(x, y, w, 18, 'float'));
const gate = S(ARENA_X, -400, 16, 860, 'gate'); gate.off = true;
const CHECKPOINTS = [{ x: 90, y: 460 }, { x: 3560, y: 400 }, { x: 6200, y: 460 }];

const SPAWNS = [
  ...[[720, 460], [1750, 460], [2150, 460], [2450, 460], [3080, 300], [3700, 400], [3950, 400], [4500, 460], [4750, 460], [5050, 460], [5350, 420], [5650, 420], [6300, 460]].map(([x, y]) => ['shade', x, y]),
  ...[[950, 300], [1450, 260], [1950, 300], [2350, 260], [2850, 280], [3450, 170], [4150, 250], [4700, 220], [5150, 260], [5550, 300], [6100, 280], [6450, 300]].map(([x, y]) => ['wisp', x, y]),
  ...[[1070, 280], [2500, 460], [3370, 220], [4980, 240], [5800, 420], [6480, 460]].map(([x, y]) => ['crystal', x, y])
];
const ITEMS = [['mana', 680, 300], ['potion', 2680, 320], ['heart', 3060, 260], ['mana', 4660, 280], ['potion', 4950, 200], ['heart', 5960, 310]];

// ───────── 背景素材（固定亂數種子） ─────────
const R = rng(1986);
const STARS = Array.from({ length: 150 }, () => ({ x: R() * (VW + 40), y: R() * 330, s: 0.5 + R() * 1.6, ph: R() * 6.28 }));
const SPIRES = []; for (let x = 0; x < 1400; x += 60 + R() * 120) SPIRES.push({ x, w: 26 + R() * 50, h: 120 + R() * 200 });
const RUINS = []; for (let x = 0; x < 1800; x += 110 + R() * 160) RUINS.push({ x, w: 70 + R() * 90, h: 70 + R() * 150, lit: Array.from({ length: 6 }, () => R() < 0.35) });
const DECOR = []; for (const s of solids) if (s.kind === 'ground') for (let x = s.x + 30; x < s.x + s.w - 30; x += 80 + R() * 160) DECOR.push({ x, y: s.y, h: 10 + R() * 22, t: R() * 6 });

// ───────── 招式表 ─────────
// hits：[開始, 結束（佔招式時間的比例）, 傷害, 擊退力, 標記]；box：面向右時相對腳底的 [左, 上, 右, 下]
// cancel：招式進行到這個比例後，可以接下一招；glow：出招時發光的肢體（fa 前手、ba 後手、fl 前腳、bl 後腳）
const MOVES = {
  jab:      { name: '刺拳',     dur: 0.24, hits: [[0.2, 0.5, 2, 20]], box: [8, -90, 56, -46], cancel: 0.35, lunge: 120, glow: 'fa', sfx: 'punch' },
  kick:     { name: '迴旋踢',   dur: 0.34, hits: [[0.28, 0.55, 3, 40]], box: [4, -98, 66, -36], cancel: 0.45, lunge: 160, glow: 'fl', sfx: 'kick' },
  tornado:  { name: '旋風踢',   dur: 0.52, hits: [[0.2, 0.38, 3, 30], [0.5, 0.7, 3, 160]], box: [-38, -92, 64, -30], cancel: 0.75, lunge: 140, glow: 'fl', sfx: 'kick' },
  finisher: { name: '流星爆拳', dur: 0.82, hits: [[0.1, 0.28, 3, 10, 'knee'], [0.48, 0.62, 10, 480, 'burst']], box: [0, -106, 90, -28], cancel: 2, lunge: 0, glow: 'fa', sfx: 'charge' },
  heavy:    { name: '重拳',     dur: 0.42, hits: [[0.38, 0.6, 4, 170]], box: [8, -92, 68, -44], cancel: 0.6, lunge: 220, glow: 'fa', sfx: 'punch' },
  heavy2:   { name: '後旋踢',   dur: 0.48, hits: [[0.35, 0.6, 5, 240]], box: [-10, -98, 70, -36], cancel: 0.7, lunge: 120, glow: 'bl', sfx: 'kick' },

// ───────── 物理與碰撞 ─────────
function boxOf(e) {

const overlap = (a, b) => a.l < b.r && a.r > b.l && a.t < b.b && a.b > b.t;
function moveEntity(e, dt) {

    if (r <= s.x || l >= s.x + s.w || b <= s.y || t >= s.y + s.h) continue;
    if (e.x < s.x + s.w / 2) e.x = s.x - e.w / 2; else e.x = s.x + s.w + e.w / 2;

    if (r <= s.x || l >= s.x + s.w || b <= s.y || t >= s.y + s.h) continue;

}

// ───────── 特效 ─────────

}

// ───────── 主角：受傷與道具 ─────────
function hurtPlayer(n, srcX) {

// ───────── 主角：招式 ─────────
function chooseMove(btn) {

function updatePlayer(dt) {
  const p = P;
  if (p.inv > 0) p.inv -= dt; if (p.castT > 0) p.castT -= dt; if (p.magicCD > 0) p.magicCD -= dt;
  if (p.dodgeCD > 0) p.dodgeCD -= dt;

  // 閃避：LB／Q 往左、RB／E 往右；往面向的方向是前衝刺，往背後是後空翻。閃避期間無敵，空中每跳只能閃一次
  const dodgeDir = hit('dodgeL') ? -1 : hit('dodgeR') ? 1 : 0;
  if (!p.dodge && p.hurtT <= 0 && p.dodgeCD <= 0 && dodgeDir && (p.onGround || p.airDodge)) {
    const type = dodgeDir === p.face ? 'rush' : 'flip';
    if (!p.onGround) p.airDodge = false;
    p.slideT = 0; p.atk = null; p.combo = ''; p.buf = null;
    p.dodge = { type, t: 0, dur: type === 'flip' ? 0.45 : 0.26 };
    if (type === 'flip') { p.vy = -560; p.onGround = false; audio.sfx('flip'); }
    else { p.vy = 0; audio.sfx('dash'); }

  }
  for (const g of p.trail) g.life -= dt * 3.5;
  p.trail = p.trail.filter(g => g.life > 0);

  if (hit('heavy')) p.buf = { btn: 'Y', t: 0.3 };
  if (p.buf) { p.buf.t -= dt; if (p.buf.t <= 0) p.buf = null; }

  if (p.dodge) {

    else { p.vx = p.face * 780 * (k < 0.7 ? 1 : 1 - (k - 0.7) * 2.5); p.vy = 0; }
    if (d.t - (d.lastTrail ?? -1) >= 0.035) { d.lastTrail = d.t; p.trail.push({ x: p.x, y: p.y, face: p.face, rot: d.type === 'flip' ? -6.283 * Math.min(1, k) : 0, pose: heroPose(heroState()), life: 1 }); }
    if (k >= 1 || (d.type === 'flip' && d.t > 0.15 && p.onGround)) { p.dodge = null; p.dodgeCD = 0.3; }
  } else if (p.hurtT > 0) { p.hurtT -= dt; p.vx *= 0.96; }

    if (!p.onGround) p.slideT = 0;

  }

  if (hit('slide') && p.onGround && p.slideT <= 0 && p.hurtT <= 0 && !p.dodge) { p.slideT = 0.38; p.atk = null; p.combo = ''; audio.sfx('slide'); }
  if (hit('jump')) p.jumpBuf = 0.12;
  p.coyote = p.onGround ? 0.1 : p.coyote - dt;
  if (p.jumpBuf > 0) {

    if (p.coyote > 0 && p.hurtT <= 0 && !p.dodge && !(p.atk && !p.atk.m.air && a_k(p) < p.atk.m.cancel)) {
      if (D && p.onGround && p.slideT <= 0) { p.slideT = 0.38; audio.sfx('slide'); }
      else { p.vy = -830; p.onGround = false; p.slideT = 0; audio.sfx('jump'); }

function updEnemies(dt) {

// ───────── 影騎士 ─────────

  b.hp -= n; b.flash = 0.1;

}
function updBoss(dt) {
  const b = boss;

        const v = ph2 ? 480 : 400;
        shots.push({ kind: 'shock', x: b.x - 30, y: b.y, vx: -v, vy: 0, life: 1.8, w: 26, h: 42, dmg: 4 }, { kind: 'shock', x: b.x + 30, y: b.y, vx: v, vy: 0, life: 1.8, w: 26, h: 42, dmg: 4 });

  if ((b.st === 'dash' || b.st === 'leap' || (b.st === 'enter' && !b.landed)) && overlap(boxOf(P), { l: b.x - 24, t: b.y - 110, r: b.x + 24, b: b.y })) hurtPlayer(4, b.x);

// ───────── 飛行物、道具 ─────────
function updProjectiles(dt) {
  for (const w of waves) {
    w.x += w.vx * dt; w.y += w.vy * dt; w.life -= dt;
    if (Math.random() < 0.8) parts.push({ x: w.x, y: w.y + (Math.random() - 0.5) * w.r, vx: -w.vx * 0.05, vy: 0, life: 0.25, max: 0.25, color: `rgb(${w.color})`, size: 2.5, g: 0 });
    const wb = { l: w.x - w.r, t: w.y - w.r, r: w.x + w.r, b: w.y + w.r };
    for (const e of enemies) if (e.alive && e.active && w.life > 0 && overlap(wb, boxOf(e))) { damageEnemy(e, w.dmg, 140, '', true); w.life = 0; }
    if (w.life > 0 && boss.active && overlap(wb, boxOf(boss))) { if (damageBoss(w.dmg, '', true)) w.life = 0; }
    if (w.life > 0 && solidAt(w.x, w.y)) { w.life = 0; burst(w.x, w.y, 5, `rgb(${w.color})`, 120, 2, 0.3); }

    const sbx = s.kind === 'shock' ? { l: s.x - s.w / 2, t: s.y - s.h, r: s.x + s.w / 2, b: s.y } : { l: s.x - s.r * 0.7, t: s.y - s.r * 0.7, r: s.x + s.r * 0.7, b: s.y + s.r * 0.7 };
    if (s.kind === 'shock' && (s.x < ARENA_X + 20 || s.x > LEVEL_W - 10)) s.life = 0;
    if (s.life > 0 && overlap(pb, sbx)) { hurtPlayer(s.dmg, s.x - s.vx); if (!P.dodge) s.life = 0; }

      if (!solidAt(it.x, it.y + 14) || it.vy < 0) { it.vy = Math.min(it.vy + G * 0.6 * dt, 600); it.y += it.vy * dt; } else it.vy = 0;

// ───────── 更新 ─────────
function update(dt) {
  time += dt; stateT += dt;
  if (shakeT > 0) { shakeT -= dt; if (shakeT <= 0) shakeMag = 0; }
  if (banner > 0) banner -= dt;
  if (padToast > 0) padToast -= dt;
  if (flashT > 0) flashT -= dt;
  if (moveBanner > 0) moveBanner -= dt;
  if (comboT > 0) { comboT -= dt; if (comboT <= 0) comboHits = 0; }
  if (hit('mute')) audio.toggleMute();
  if (hit('retro')) { retro = !retro; store.set('ab.retro', retro); }
  switch (state) {
    case 'title':
      audio.play('title'); camX = (time * 40) % (LEVEL_W - VW);
      if (anyStart()) { audio.unlock(); setState('intro'); }
      break;
    case 'intro': {
      const total = INTRO.join('').length, shown = stateT * 26;
      if (anyStart()) { if (shown < total) stateT = total / 26 + 0.01; else newGame(); }
      camX = (time * 40) % (LEVEL_W - VW);
      break;
    }
    case 'play':
      if (hit('pause') || hit('start')) { setState('pause'); break; }
      // 打中時的頓格：畫面停一下，但攻擊輸入照樣收進緩衝
      if (hitstop > 0) {
        hitstop -= dt;
        if (hit('light')) P.buf = { btn: 'X', t: 0.3 }; if (hit('heavy')) P.buf = { btn: 'Y', t: 0.3 };
        if (hit('jump')) P.jumpBuf = 0.12;
        updParticles(dt * 0.25); break;
      }
      updatePlayer(dt); if (state !== 'play') break;
      updEnemies(dt); updBoss(dt); updProjectiles(dt); updParticles(dt); updCamera(dt);
      break;
    case 'pause': if (hit('pause') || hit('start')) setState('play'); break;
    case 'dying':
      P.vy += G * 0.6 * dt; P.y += P.vy * dt; P.x += P.vx * dt; updParticles(dt);
      if (stateT > 1.8) {
        lives--;
        if (lives < 0) { if (score > hi) { hi = score; store.set('ab.hi', hi); } setState('gameover'); }
        else { respawn(); audio.play(boss.active ? 'boss' : 'stage'); setState('play'); }
      }
      break;
    case 'gameover':
      if (stateT > 0.8 && anyStart()) { lives = 2; score = Math.floor(score / 2); resetBoss(); respawn(); audio.play('stage'); setState('play'); }
      break;
    case 'clear':
      updParticles(dt);
      if (stateT > 2 && anyStart()) setState('title');
      break;

}

    c.globalAlpha = 0.45 + 0.55 * Math.sin(time * 2 + s.ph) ** 2; c.fillStyle = '#ffffff';
    c.fillRect(x, s.y, s.s, s.s);
  }

  const mx = 760 - cx * 0.02, my = 112;
  const mg = c.createRadialGradient(mx, my, 20, mx, my, 160); mg.addColorStop(0, 'rgba(255,240,220,0.45)'); mg.addColorStop(1, 'rgba(255,240,220,0)');

  const off1 = cx * 0.15; c.fillStyle = mix('#2b2266', '#3a1338', mood);
  for (let base = Math.floor(off1 / 1400) * 1400; base < off1 + VW + 1400; base += 1400) for (const s of SPIRES) {
    const x = base + s.x - off1; if (x < -100 || x > VW + 100) continue;
    c.beginPath(); c.moveTo(x, 420); c.lineTo(x + s.w * 0.15, 420 - s.h * 0.7); c.lineTo(x + s.w * 0.5, 420 - s.h); c.lineTo(x + s.w * 0.85, 420 - s.h * 0.7); c.lineTo(x + s.w, 420); c.fill();
  }

  for (let base = Math.floor(off2 / 1800) * 1800; base < off2 + VW + 1800; base += 1800) for (const r of RUINS) {
    const x = base + r.x - off2; if (x < -200 || x > VW + 200) continue;
    c.fillStyle = mix('#17113a', '#200a22', mood); c.fillRect(x, 470 - r.h, r.w, r.h + 80);
    c.beginPath(); c.moveTo(x - 6, 470 - r.h); c.lineTo(x + r.w / 2, 470 - r.h - 26); c.lineTo(x + r.w + 6, 470 - r.h); c.fill();
    r.lit.forEach((on, i) => { if (!on) return; c.fillStyle = `rgba(159,232,255,${0.25 + 0.2 * Math.sin(time * 1.5 + i)})`; c.fillRect(x + 12 + (i % 2) * (r.w - 34), 470 - r.h + 20 + Math.floor(i / 2) * 34, 10, 16); });
  }
  for (let i = 0; i < 3; i++) {
    const y = 360 + i * 40, fg = c.createLinearGradient(0, y - 30, 0, y + 30);
    fg.addColorStop(0, 'rgba(180,150,255,0)'); fg.addColorStop(0.5, `rgba(180,150,255,${0.07 + i * 0.02})`); fg.addColorStop(1, 'rgba(180,150,255,0)');
    c.fillStyle = fg; c.fillRect(0, y - 30, VW, 60);
  }
}
function drawWorld(c, cx) {
  for (const s of solids) {
    if (s.off || s.kind === 'wall') continue;
    const x = s.x - cx; if (x > VW + 20 || x + s.w < -20) continue;
    if (s.kind === 'ground') {
      const g = c.createLinearGradient(0, s.y, 0, s.y + 200); g.addColorStop(0, '#2d2558'); g.addColorStop(1, '#0c0920');
      c.fillStyle = g; c.fillRect(x, s.y, s.w, s.h);

      for (let gx = Math.ceil(s.x / 46) * 46; gx < s.x + s.w; gx += 46) { c.moveTo(gx - cx, s.y + 10); c.lineTo(gx - cx + 8, s.y + s.h); }
      c.stroke();

    } else if (s.kind === 'float') {

      c.fillStyle = g; c.beginPath(); c.moveTo(x, s.y); c.lineTo(x + s.w, s.y); c.lineTo(x + s.w - 10, s.y + s.h); c.lineTo(x + 10, s.y + s.h); c.fill();
      c.fillStyle = '#a9f0ff'; c.fillRect(x, s.y, s.w, 2);
    } else if (s.kind === 'gate') {
      const a = 0.5 + 0.3 * Math.sin(time * 8);
      const g = c.createLinearGradient(x - 10, 0, x + 26, 0); g.addColorStop(0, 'rgba(192,139,255,0)'); g.addColorStop(0.5, `rgba(192,139,255,${a})`); g.addColorStop(1, 'rgba(192,139,255,0)');
      c.fillStyle = g; c.fillRect(x - 10, 0, 36, 460);

    c.beginPath(); c.moveTo(x - 4, d.y); c.lineTo(x, d.y - d.h); c.lineTo(x + 4, d.y); c.fill();
    c.beginPath(); c.moveTo(x + 4, d.y); c.lineTo(x + 9, d.y - d.h * 0.55); c.lineTo(x + 12, d.y); c.fill();
  }
  CHECKPOINTS.forEach((cp, i) => {

  });
}

// ───────── 主角姿勢 ─────────
// 九頭身：頭高約 10，全身約 90。角度以「正下方為 0、往前（面向）為正」表示，四肢各兩節
const BASE = { hipY: -46, lean: 0, fl: [0.1, 0.04], bl: [-0.08, -0.1], fa: [0.18, 0.32], ba: [-0.12, -0.02], head: 0, spin: 1, lift: 0, skirt: 0 };

      if (!e.alive || !e.active || e.x < cx - 80 || e.x > cx + VW + 80) continue;

    }

    // 閃避殘影
    for (const g of P.trail) {
      c.save(); c.globalAlpha = 0.28 * g.life;
      c.translate(g.x - cx, g.y - 45); c.rotate(g.rot * g.face); c.translate(-(g.x - cx), -(g.y - 45));
      drawHeroine(c, g.x - cx, g.y, { face: g.face, s: 1, t: time, vx: 300, vy: -1, air: true }, g.pose);
      c.restore();
    }
    const flick = P.inv > 0 && state === 'play' && Math.floor(time * 20) % 2;
    if (!flick && state !== 'clear') {
      const d = P.dodge, hs = heroState(), gx = P.x - cx, gy = P.y - 45;
      let glow = '';
      if (P.atk) {
        const k = P.atk.t / P.atk.m.dur, act = P.atk.m.hits.find(h => k >= h[0] - 0.05 && k <= h[1] + 0.05);
        if (act) glow = act[4] === 'knee' ? 'fl' : P.atk.m.glow;
      }
      if (P.castT > 0) glow = 'fa';
      c.save();
      if (d) {
        const gl = c.createRadialGradient(gx, gy, 4, gx, gy, 60);
        gl.addColorStop(0, 'rgba(159,232,255,0.4)'); gl.addColorStop(1, 'rgba(159,232,255,0)');
        c.fillStyle = gl; c.fillRect(gx - 60, gy - 60, 120, 120);
        if (d.type === 'flip') { c.translate(gx, gy); c.rotate(-6.283 * Math.min(1, d.t / d.dur) * P.face); c.translate(-gx, -gy); }
      }
      if (P.atk && P.atk.name === 'finisher' && P.atk.t / P.atk.m.dur > 0.3 && P.atk.t / P.atk.m.dur < 0.5) {
        const fx = gx + P.face * 4, fy = P.y - 72, gl = c.createRadialGradient(fx, fy, 2, fx, fy, 70);
        gl.addColorStop(0, 'rgba(255,214,140,0.55)'); gl.addColorStop(1, 'rgba(255,214,140,0)'); c.fillStyle = gl; c.fillRect(fx - 70, fy - 70, 140, 140);
      }
      drawHeroine(c, gx, P.y, { ...hs, face: P.face, s: 1, glow });
      c.restore();
    }
    drawFx(c, cx);
  }
  c.restore();
  if (flashT > 0) { c.fillStyle = `rgba(255,248,225,${clamp(flashT / 0.2, 0, 1) * 0.55})`; c.fillRect(0, 0, VW, VH); }
  switch (state) {
    case 'title': drawTitle(c); break;
    case 'intro': drawIntro(c); break;
    case 'play': case 'dying': drawHUD(c); break;
    case 'pause': drawHUD(c); drawCenterCard(c, '暫停', '', padName ? '按 Menu 繼續' : '按 P 或 Enter 繼續', '#9fe8ff'); drawHelp(c, 210, 360); break;
    case 'gameover': drawCenterCard(c, 'GAME OVER', `分數 ${score}`, (padName ? '按 A' : '按 Enter') + ' 從檢查點繼續（分數減半）', '#ff3b5c'); break;
    case 'clear': drawHUD(c); drawClear(c); break;
  }
  if (padToast > 0) {
    c.globalAlpha = clamp(padToast * 2, 0, 1);
    const msg = padName ? `已連接 ${padName}` : '手把已中斷連線';
    c.font = `700 15px ${FS}`; const w = c.measureText(msg).width + 36;
    c.fillStyle = 'rgba(8,6,24,0.8)'; rrect(c, (VW - w) / 2, 96, w, 34, 17); c.fill();
    txt(c, msg, VW / 2, 119, `700 15px ${FS}`, padName ? '#9fe8ff' : '#ffb0c8', 'center');
    c.globalAlpha = 1;
  }
}
function frame() {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#05040f'; ctx.fillRect(0, 0, cvs.width, cvs.height);
  if (retro) {
    lctx.setTransform(320 / VW, 0, 0, 180 / VH, 0, 0); lctx.imageSmoothingEnabled = true;
    render(lctx);
    ctx.imageSmoothingEnabled = false; ctx.drawImage(low, offX, offY, VW * scale, VH * scale);
  } else {
    ctx.setTransform(scale, 0, 0, scale, offX, offY);
    ctx.save(); ctx.beginPath(); ctx.rect(0, 0, VW, VH); ctx.clip(); render(ctx); ctx.restore();
  }
}
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min((now - last) / 1000, 1 / 30); last = now;
  pollPad(); update(dt); frame(); audio.tick();
  for (const k in pressed) pressed[k] = false;
}
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') setState('pause'); });
window.__game = { get state() { return state; }, P, boss, newGame, hurt: hurtPlayer, get combo() { return comboHits; }, get score() { return score; }, get enemies() { return enemies; } };
requestAnimationFrame(t => { last = t; loop(t); });
</script>
